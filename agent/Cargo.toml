[package]
name = "termy-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
description = "Termy remote MVP agent: outbound WSS client, PTY host and file receiver"

[[bin]]
name = "termy-agent"
path = "src/main.rs"

# Versions are pinned exactly per doc 1.2.
[dependencies]
tokio = { version = "=1.49.0", features = ["rt-multi-thread", "net", "sync", "signal", "macros", "time", "fs", "io-util", "process"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
rustls = { version = "=0.23.31", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=0.26.11"
futures-util = "=0.3.31"

portable-pty = "=0.9.0"

serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
uuid = { version = "=1.20.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.42", default-features = false, features = ["std", "serde", "clock"] }

clap = { version = "=4.5.40", features = ["derive"] }
thiserror = "=2.0.18"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }
base64 = "=0.22.1"
rand = "=0.8.5"

termy-protocol = { path = "../protocol/generated/rust" }

# Job Object based process-tree teardown, per doc 7.5.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "=3.14.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
