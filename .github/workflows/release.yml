name: Release

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Check tag and release metadata
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const version = process.env.RELEASE_VERSION;
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const escapedVersion = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const changelogHeading = new RegExp(`^## \\[${escapedVersion}\\](?:\\s+-\\s+.+)?$`, 'm');

          if (manifest.version !== version || packageJson.version !== version) {
            throw new Error(
              `Tag ${version} must match manifest.json (${manifest.version}) and package.json (${packageJson.version})`
            );
          }
          if (!changelogHeading.test(changelog)) {
            throw new Error(`CHANGELOG.md is missing a ## [${version}] section`);
          }
          NODE

  build-rust:
    name: Build Rust ${{ matrix.platform }}-${{ matrix.arch }}
    needs: validate-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: macos-latest
            platform: darwin
            arch: arm64
            target: aarch64-apple-darwin
            ext: ''
          - os: macos-latest
            platform: darwin
            arch: x64
            target: x86_64-apple-darwin
            ext: ''
          - os: ubuntu-latest
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            ext: ''
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            ext: ''

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-servers -> target
          key: ${{ matrix.target }}

      - name: Build
        working-directory: rust-servers
        env:
          TERMINAL_SERVER_VERSION: ${{ github.ref_name }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p binaries
          BINARY_NAME="termy-server-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}"
          cp "rust-servers/target/${{ matrix.target }}/release/termy-server${{ matrix.ext }}" "binaries/${BINARY_NAME}"
          
          cd binaries
          if command -v sha256sum &> /dev/null; then
            sha256sum "${BINARY_NAME}" > "${BINARY_NAME}.sha256"
          else
            shasum -a 256 "${BINARY_NAME}" > "${BINARY_NAME}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            binaries/termy-server-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}
            binaries/termy-server-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}.sha256

  build-agent:
    name: Build Agent ${{ matrix.platform }}-${{ matrix.arch }}
    needs: validate-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: ubuntu-latest
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            ext: ''

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          key: release-agent-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --manifest-path agent/Cargo.toml --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p release-assets
          ASSET_NAME="termy-agent-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}"
          cp "agent/target/${{ matrix.target }}/release/termy-agent${{ matrix.ext }}" "release-assets/${ASSET_NAME}"

          cd release-assets
          if command -v sha256sum &> /dev/null; then
            sha256sum "${ASSET_NAME}" > "${ASSET_NAME}.sha256"
          else
            shasum -a 256 "${ASSET_NAME}" > "${ASSET_NAME}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: agent-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/termy-agent-*

  build-relay:
    name: Build Relay linux-x64
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay
          key: release-relay-x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --locked --manifest-path relay/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Prepare binary
        run: |
          mkdir -p release-assets
          cp relay/target/x86_64-unknown-linux-gnu/release/termy-relay release-assets/termy-relay-linux-x64
          cd release-assets
          sha256sum termy-relay-linux-x64 > termy-relay-linux-x64.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: relay-linux-x64
          path: release-assets/termy-relay-linux-x64*

  release:
    name: Release
    needs: [build-rust, build-agent, build-relay]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          pattern: 'server-*'
          path: binaries
          merge-multiple: true

      - name: Download agent binaries
        uses: actions/download-artifact@v7
        with:
          pattern: 'agent-*'
          path: release-assets
          merge-multiple: true

      - name: Download relay binaries
        uses: actions/download-artifact@v7
        with:
          pattern: 'relay-*'
          path: release-assets
          merge-multiple: true

      - name: Set permissions
        run: |
          chmod +x binaries/termy-server-darwin-* || true
          chmod +x binaries/termy-server-linux-* || true
          chmod +x release-assets/termy-agent-linux-* || true
          chmod +x release-assets/termy-relay-linux-* || true

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Generate release notes
        run: |
          node scripts/release-notes.js \
            --version "${{ github.ref_name }}" \
            --repository "${{ github.repository }}" \
            --output release-body.md

      - name: Prepare release assets
        run: |
          # BRAT 需要的三个核心文件（直接上传，不打包）
          # main.js, manifest.json, styles.css 已在根目录
          
          # 设置二进制文件执行权限
          chmod +x binaries/termy-server-darwin-* || true
          chmod +x binaries/termy-server-linux-* || true
          
          # 创建完整包（所有平台，供手动安装）
          mkdir -p termy/binaries
          cp main.js manifest.json styles.css termy/
          cp binaries/termy-server-* termy/binaries/
          chmod +x termy/binaries/termy-server-darwin-* || true
          chmod +x termy/binaries/termy-server-linux-* || true
          zip -r "termy-${{ github.ref_name }}.zip" termy

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            main.js
            manifest.json
            styles.css
            termy-${{ github.ref_name }}.zip
            binaries/termy-server-win32-x64.exe
            binaries/termy-server-win32-x64.exe.sha256
            binaries/termy-server-darwin-arm64
            binaries/termy-server-darwin-arm64.sha256
            binaries/termy-server-darwin-x64
            binaries/termy-server-darwin-x64.sha256
            binaries/termy-server-linux-x64
            binaries/termy-server-linux-x64.sha256
            binaries/termy-server-linux-arm64
            binaries/termy-server-linux-arm64.sha256
            release-assets/termy-agent-win32-x64.exe
            release-assets/termy-agent-win32-x64.exe.sha256
            release-assets/termy-agent-linux-x64
            release-assets/termy-agent-linux-x64.sha256
            release-assets/termy-relay-linux-x64
            release-assets/termy-relay-linux-x64.sha256
          body_path: release-body.md
          draft: false
          prerelease: false
